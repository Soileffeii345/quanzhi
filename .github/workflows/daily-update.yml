name: Daily verified-data update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-update.yml"
      - "bootstrap/quanzhi.sqlite.gz"
  schedule:
    # Beijing time 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-verified-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download private database backup
        run: |
          mkdir -p collector/data
          if gh release view database-backup >/dev/null 2>&1; then
            gh release download database-backup --pattern quanzhi.sqlite.gz --dir collector/data --clobber
          elif [ -f bootstrap/quanzhi.sqlite.gz ]; then
            cp bootstrap/quanzhi.sqlite.gz collector/data/quanzhi.sqlite.gz
          else
            echo "No database backup is available" >&2
            exit 1
          fi

      - name: Restore and validate SQLite
        run: |
          npm run db:restore
          npm run data:audit

      - name: Collect, verify, and export new data
        run: npm run data:update

      - name: Block publication when evidence checks fail
        run: |
          npm run data:audit
          npm run data:audit:links
          npm test

      - name: Refresh private database backup
        run: |
          npm run db:backup
          gh release view database-backup >/dev/null 2>&1 || gh release create database-backup --title "Database backup" --notes "Private operational backup for the verified daily-data workflow."
          gh release upload database-backup collector/data/quanzhi.sqlite.gz --clobber

      - name: Commit verified public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No verified public-data changes"
          else
            git commit -m "data: publish verified daily update"
            git push origin HEAD:main
          fi

      # Vercel is connected to this repository. A verified commit to main
      # triggers the production deployment without storing deploy credentials.
